url: https://andjar.github.io/metawoRld/

template:
  bootstrap: 5
  bslib:
    preset: bootstrap
    primary: "#2c6e9e"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "metawoRld: structured, validated, traceable data for living systematic reviews"
  description: >
    One validated door for every data channel, provenance and human
    verification for every value, file hashes, and a living meta-analysis
    dashboard. Plain files, open source, R.

navbar:
  structure:
    left: [intro, app, example, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting_started.html
    app:
      text: The app
      href: articles/app.html
    example:
      text: Worked example
      href: articles/worked-example.html
    articles:
      text: Articles
      menu:
      - text: The metawoRld app
        href: articles/app.html
      - text: Concepts and workflow
        href: articles/conceptual_overview.html
      - text: Worked example (IL-6 in preeclampsia)
        href: articles/worked-example.html
      - text: Project specification (SPEC v1)
        href: SPEC.html

articles:
- title: Articles
  navbar: ~
  contents:
  - getting_started
  - conceptual_overview
  - articles/app
  - articles/worked-example

