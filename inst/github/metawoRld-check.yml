# Checks the metawoRld project on every push and pull request:
# forms, schemas, file hashes, provenance, people, records and submissions.
# The check is a plain Rscript call and can run in any CI system.
name: metawoRld check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: github::andjar/metawoRld

      - name: Check project
        run: Rscript -e 'metawoRld::check_project(".", ci = TRUE)'
