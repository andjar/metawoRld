# metawoRld screening (title/abstract assessment) schema.
# Same node format as _extraction_schema.yml. The fields `decision`, `score`
# and `rationale` are used by DataFindR and must be kept.

_type: object
_description: "Screening decision for one study based on its title and abstract."

decision:
  _type: enum
  _description: >-
    Include: the study likely meets all inclusion criteria and no exclusion criteria.
    Exclude: the study clearly meets an exclusion criterion or fails an inclusion criterion.
    Needs manual review: the title/abstract does not allow a confident decision.
  _values: [Include, Exclude, Needs manual review]
score:
  _type: number
  _description: "Probability (0.0-1.0) that the study should be included. ~0.9+ for Include, ~0.1 or lower for Exclude."
rationale:
  _type: string
  _description: "One or two sentences referring to the specific criteria (or missing information)."
exclusion_reason:
  _type: string
  _description: "If excluded: the single most important criterion that was not met (copy its wording). Empty otherwise."
  _required: false
